
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support Me</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  background: #111;
  overflow: hidden;
}

.background {
  position: fixed;
  inset: -15px;
  background-image: url('BlueCamera-29DC6709-11C5-4664-832F-AD64273D0151-Original.jpeg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  filter: blur(9px);
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
}

main {
  position: relative;
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.support-button {
  display: block;
  width: 100%;
  max-width: 320px;
  padding: 20px;
  border-radius: 50px;
  background: white;
  color: black;
  text-align: center;
  text-decoration: none;
  font-size: 20px;
  font-weight: 700;
  box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  transition: transform 0.2s ease;
}

.support-button:hover {
  transform: scale(1.04);
}

.support-button:active {
  transform: scale(0.96);
}
</style>
</head>

<body>

<div class="background"></div>
<div class="overlay"></div>

<main>
  <a class="support-button"
     href="https://tinyurl.com/3rdx9f8j">
    Support Me
  </a>
</main>

</body>
</html>
