
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Support Me</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: Arial, sans-serif; background: #111; }

    .background {
      position: fixed;
      inset: -18px;
      background: url('background.jpg') center / cover no-repeat;
      filter: blur(9px);
      transform: scale(1.04);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.42);
    }

    main {
      position: relative;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: min(320px, 85vw);
      padding: 20px 32px;
      border-radius: 999px;
      background: white;
      color: #151515;
      text-decoration: none;
      font-weight: 700;
      font-size: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,.25);
      transition: transform .2s;
    }

    a:hover { transform: scale(1.04); }
    a:focus-visible {
      outline: 3px solid white;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <div class="background"></div>
  <div class="overlay"></div>
  <main>
    <a href="https://tinyurl.com/3rdx9f8j"
       target="_blank"
       rel="noopener noreferrer">
      Support Me
    </a>
  </main>
</body>
</html>
